spring.application.name=ecommerce
server.port=${PORT:8090}

# ===== SWAGGER/OPENAPI CONFIGURATION =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== JACKSON SERIALIZATION CONFIGURATION =====
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== MULTIPART FILE UPLOAD LIMITS =====
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ===== JAVA 21 VIRTUAL THREADS CONFIGURATION =====
spring.threads.virtual.enabled=true

# ===== LETTUCE REDIS CLIENT POOL CONFIGURATION =====
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=2000ms
spring.data.redis.lettuce.pool.time-between-eviction-runs=30000ms
spring.data.redis.lettuce.shutdown-timeout=100ms
spring.data.redis.timeout=5000ms

# ===== TASK SCHEDULING CONFIGURATION =====
spring.task.scheduling.pool.size=10

# ===== HIBERNATE 6 GLOBAL ENUM MAPPING =====
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=12

# ===== MAIL PROVIDER CONFIGURATION =====
app.mail.provider=${APP_MAIL_PROVIDER:smtp}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
app.frontend.url=${APP_FRONTEND_URL:https://easyshoping.fun}

# ===== COMPANY & SUPPORT CONFIGURATION =====
app.company.name=${APP_COMPANY_NAME:E-Commerce Corp}
app.company.support-email=${APP_SUPPORT_EMAIL:supportecommerces@gmail.com}

